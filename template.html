<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Enter password</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-color: light-dark(hsl(216deg 50% 98%), hsl(216deg 50% 20%));
      --font-color: light-dark(hsl(216deg 50% 10%), hsl(216deg 60% 98%));
      --border-color: light-dark(hsl(216deg 50% 80%), hsl(216deg 50% 50%));
      --border-focus-color: light-dark(hsl(216deg 50% 70%), hsl(216deg 50% 60%));
      --shadow-color: light-dark(hsl(216deg 50% 80%), hsl(216deg 50% 20%));
      --button-bg-color: light-dark(hsl(216deg 50% 90%), hsl(216deg 50% 20%));
    }

    ::selection {      
      background: hsl(216deg 50% 60%);
    }

    body {
      font-family: system-ui, sans-serif;
      min-block-size: 100dvb;
      margin: 0;
      background: var(--bg-color);
      color: var(--font-color);
      display: grid;
      place-items: center;
    }

    label {
      display: block;
    }

    input,
    button {
      font-size: 1rem;
      padding-inline: 4px;
      padding-block: 8px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      transition: filter 600ms, border 600ms;
    }

    :is(input, button):focus-within,
    button:hover {
      border: 1px solid var(--border-focus-color);
      filter: drop-shadow(0 0 4px var(--shadow-color));
      transition: filter 200ms, border 200ms;
    }

    button {
      background: var(--button-bg-color);
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <form>
      <label for="password">Password</label>
      <input type="password" name="password" id="password" required>
      <button>Unlock</button>
    </form>
  </main>

  <script type="module">
    const input = document.querySelector('input');

    document.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault();
      const password = new FormData(e.target).get('password');
      try {
        const newDocument = await decrypt(content, password);
        document.open();
        document.write(newDocument);
        document.close();
      }
      catch {
        input.setCustomValidity('Incorrect password.');
        input.reportValidity();
      }
    });

    input.addEventListener('input', e => e.target.setCustomValidity(''));
  </script>
</body>

</html>
